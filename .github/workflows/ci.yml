name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: Contract and core validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Repository contract check
        run: npm run check

      - name: Unit and contract tests
        run: npm test

      - name: Zero-code CSV preflight smoke
        run: npm run preflight:demo

      - name: Assisted mapping smoke
        run: npm run mapping:demo

      - name: Zero-code onboarding smoke
        run: npm run onboarding:smoke

      - name: Third-party connector contract smoke
        run: npm run contract:reference

      - name: Durable HTTP runtime smoke
        run: npm run runtime:smoke

      - name: WooCommerce connector contract
        run: npm run woo:contract

      - name: WooCommerce PHP syntax
        run: find connectors/woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l
