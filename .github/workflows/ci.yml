name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Contract and core validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Repository contract check
        run: npm run check

      - name: Unit and contract tests
        run: npm test

      - name: Zero-code CSV preflight smoke
        run: npm run preflight:demo

      - name: Assisted mapping smoke
        run: npm run mapping:demo

      - name: Zero-code onboarding smoke
        run: npm run onboarding:smoke

      - name: Third-party connector contract smoke
        run: npm run contract:reference

      - name: Native connector reconciliation contract v2
        run: npm run native:contract:v2

      - name: Durable HTTP runtime smoke
        run: npm run runtime:smoke

      - name: Production observability smoke
        run: npm run ops:smoke

      - name: SQLite backup and restore smoke
        run: npm run sqlite:backup:smoke

      - name: AEAT certificate preflight smoke
        run: npm run aeat:cert:smoke

      - name: AEAT evidence bundle smoke
        run: npm run aeat:evidence:smoke

      - name: AEAT official reconciliation smoke
        run: npm run aeat:reconciliation:smoke

      - name: AEAT live reconciliation CLI smoke
        run: npm run aeat:reconcile:smoke

      - name: AEAT controlled reconciliation seed smoke
        run: npm run aeat:seed:smoke

      - name: AEAT controlled rejection profile smoke
        run: npm run aeat:rejection:smoke

      - name: AEAT final gate evidence verifier smoke
        run: npm run aeat:final-evidence:smoke

      - name: Durable AEAT outbox smoke
        run: npm run aeat:outbox:smoke

      - name: WooCommerce connector contract
        run: npm run woo:contract

      - name: WooCommerce release package
        run: npm run woo:package:check

      - name: WooCommerce PHP syntax
        run: find connectors/woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PrestaShop connector contract
        run: npm run prestashop:contract

      - name: PrestaShop fiscal fixtures
        run: npm run prestashop:fixtures

      - name: PrestaShop corrective VAT fixtures
        run: npm run prestashop:rectification-fixtures

      - name: PrestaShop reproducible release package
        run: npm run prestashop:package:check

      - name: PrestaShop PHP syntax
        run: find connectors/prestashop -name '*.php' -print0 | xargs -0 -n1 php -l

  woocommerce-compatibility:
    name: Woo compatibility / WP ${{ matrix.wordpress }} / WC ${{ matrix.woocommerce }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            woocommerce: '8.2.0'
            php: '7.4'
          - wordpress: '7.0.4'
            woocommerce: '11.0.1'
            php: '8.2'
          - wordpress: '7.1'
            woocommerce: '11.1.0'
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup PHP ${{ matrix.php }} and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli

      - name: Build reproducible plugin package
        run: npm run woo:package:check

      - name: Install and smoke-test real WordPress + WooCommerce
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          WOO_VERSION: ${{ matrix.woocommerce }}
        run: bash scripts/ci/woocommerce-compatibility-smoke.sh

  prestashop-compatibility:
    name: PrestaShop compatibility / PS ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: '1.7.8.11'
            php: '7.4'
            image: 'prestashop/prestashop-flashlight:1.7.8.11-7.4'
          - prestashop: '8.1.7'
            php: '8.1'
            image: 'prestashop/prestashop-flashlight:8.1.7-8.1'
          - prestashop: '8.2.7'
            php: '8.1'
            image: 'prestashop/prestashop-flashlight:8.2.7-8.1-fpm-alpine3.21-nginx'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install reproducible ZIP and build real invoice payload
        env:
          PRESTASHOP_IMAGE: ${{ matrix.image }}
          PRESTASHOP_VERSION: ${{ matrix.prestashop }}
          PRESTASHOP_PHP: ${{ matrix.php }}
        run: bash scripts/ci/prestashop-compatibility-smoke.sh

  prestashop-upgrade:
    name: PrestaShop package upgrade / PS 8.2.7 / PHP 8.1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Upgrade package and preserve local sync state
        env:
          PRESTASHOP_IMAGE: 'prestashop/prestashop-flashlight:8.2.7-8.1-fpm-alpine3.21-nginx'
          PRESTASHOP_VERSION: '8.2.7'
          PRESTASHOP_PHP: '8.1'
        run: bash scripts/ci/prestashop-upgrade-smoke.sh


  local-agent-database-compatibility:
    name: Local Agent DB / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 16
            dialect: postgresql
            image: postgres:16
            client: pg@8
          - name: MySQL 8.4
            dialect: mysql
            image: mysql:8.4
            client: mysql2@3
          - name: MariaDB 11.4
            dialect: mariadb
            image: mariadb:11.4
            client: mysql2@3
          - name: SQL Server 2022
            dialect: sqlserver
            image: mcr.microsoft.com/mssql/server:2022-latest
            client: mssql@11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install database client
        run: npm install --no-save --package-lock=false --ignore-scripts "${{ matrix.client }}"

      - name: Real read-only database smoke
        env:
          DB_DIALECT: ${{ matrix.dialect }}
          DB_IMAGE: ${{ matrix.image }}
        run: bash scripts/ci/local-agent-db-compatibility-smoke.sh


  local-agent-sftp-compatibility:
    name: Local Agent SFTP / OpenSSH
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install SFTP client
        run: npm install --no-save --package-lock=false --ignore-scripts "ssh2-sftp-client@12.1.1"

      - name: Real pinned read-only SFTP smoke
        env:
          SFTP_IMAGE: atmoz/sftp:alpine
        run: bash scripts/ci/local-agent-sftp-compatibility-smoke.sh


  local-agent-portable-build:
    name: Local Agent portable bundle / exact SHA
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PV_SOURCE_COMMIT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify portable package contract
        run: npm run local-agent:package:check
        env:
          PV_SOURCE_COMMIT: ${{ env.PV_SOURCE_COMMIT }}

      - name: Build exact portable ZIP
        run: npm run local-agent:package -- --source-commit "$PV_SOURCE_COMMIT" --output dist/kairoseth-local-agent.zip

      - name: Upload exact portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kairoseth-local-agent-portable
          path: |
            dist/kairoseth-local-agent.zip
            dist/kairoseth-local-agent.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  local-agent-portable-native:
    name: Local Agent portable / ${{ matrix.name }}
    needs: local-agent-portable-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - name: Windows x64
            runner: windows-2025
            platform: win32
            arch: x64
          - name: macOS Intel x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - name: macOS ARM64
            runner: macos-15
            platform: darwin
            arch: arm64
    env:
      PV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PV_EXPECTED_PLATFORM: ${{ matrix.platform }}
      PV_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PV_SOURCE_COMMIT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download exact portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: kairoseth-local-agent-portable
          path: artifact

      - name: Extract portable ZIP on Linux/macOS
        if: runner.os != 'Windows'
        run: |
          rm -rf .tmp/local-agent-bundle
          mkdir -p .tmp/local-agent-bundle
          unzip -q artifact/kairoseth-local-agent.zip -d .tmp/local-agent-bundle

      - name: Extract portable ZIP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .tmp/local-agent-bundle -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .tmp/local-agent-bundle | Out-Null
          Expand-Archive -LiteralPath artifact/kairoseth-local-agent.zip -DestinationPath .tmp/local-agent-bundle -Force

      - name: Install exact runtime dependencies
        working-directory: .tmp/local-agent-bundle/kairoseth-local-agent
        run: npm install --omit=dev --ignore-scripts --package-lock=false

      - name: Native status + doctor smoke
        run: >
          npm run local-agent:portable:smoke --
          --artifact artifact/kairoseth-local-agent.zip
          --checksum artifact/kairoseth-local-agent.zip.sha256
          --bundle-root .tmp/local-agent-bundle/kairoseth-local-agent

      - name: Native Linux service lifecycle smoke
        if: runner.os == 'Linux'
        run: bash scripts/ci/local-agent-service-linux-smoke.sh .tmp/local-agent-bundle/kairoseth-local-agent

      - name: Native Linux upgrade + code-only rollback smoke
        if: runner.os == 'Linux'
        run: bash scripts/ci/local-agent-upgrade-linux-smoke.sh .tmp/local-agent-bundle/kairoseth-local-agent

      - name: Native macOS service lifecycle smoke
        if: runner.os == 'macOS'
        run: bash scripts/ci/local-agent-service-macos-smoke.sh .tmp/local-agent-bundle/kairoseth-local-agent

      - name: Native macOS upgrade + code-only rollback smoke
        if: runner.os == 'macOS'
        run: bash scripts/ci/local-agent-upgrade-macos-smoke.sh .tmp/local-agent-bundle/kairoseth-local-agent

      - name: Native Windows service lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/local-agent-service-windows-smoke.ps1 -BundleRoot .tmp/local-agent-bundle/kairoseth-local-agent

      - name: Native Windows upgrade + code-only rollback smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/local-agent-upgrade-windows-smoke.ps1 -BundleRoot .tmp/local-agent-bundle/kairoseth-local-agent
